[project]
name = "hybrid-dynamic-embedder"
version = "0.2.0"
description = "Multi-layer hyperbolic embedder for the Qwen3.8-27B MLX observer"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.32.0",
    "mlx-lm>=0.31.0",
    "mlx-vlm>=0.6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["python*"]
