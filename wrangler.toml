name = "elle-worker"
main = "src/index.ts"
# Must be <= the oldest workerd bundled by any wrangler version this project
# runs with. `wrangler deploy` validates against the latest released runtime
# (fine up to 2026-06-25), but `wrangler dev` runs 100% locally against
# whatever workerd shipped with the installed wrangler binary — which lags
# behind if that install is stale (e.g. wrangler 4.95.0 only bundles workerd
# up to 2026-06-02), and local dev then fails hard with "This Worker requires
# compatibility date ... but the newest date supported by this server binary
# is ...". Pinning to 2026-06-02 keeps both `deploy` and `dev` working
# regardless of which supported wrangler version is installed locally; bump
# it only after confirming `npx wrangler --version` is current everywhere
# `wrangler dev` gets run.
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

# Bundle the corpus seed documents (corpus/**/*.md) as Text modules, so
# src/corpus-seed.ts can `import doc from '../corpus/.../x.md'` and get the file
# contents as a string. The seedCorpus job ingests any that aren't in the corpus
# yet (chunk/embed/vectorize/index) — the docs live as real, version-controlled
# files rather than pasted into source.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallback = true

# Workers Logs — persist runtime logs so server-side errors (e.g.
# "[ROUTER] model layer unreachable: <real provider error>") are queryable in
# the dashboard (Workers & Pages → elle-worker → Logs) instead of needing a
# live `wrangler tail`. Traces left off.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[ai]
binding = "AI"

# Service binding to the RAPID²AI hospitality worker. No longer used by the
# router's own tool calls (see RAPID_DB below — those run natively against
# the same database instead of proxying HTTP through this binding), but left
# declared/bound in case anything else still depends on it.
[[services]]
binding = "RAPID_AI"
service = "rapid2ai-ai-worker"

# Service binding to the customcoursebuilder Worker — the ingester and
# maintainer of the course database. src/education/index.ts reads course
# data live through this instead of vendoring a static JSON copy.
[[services]]
binding = "CUSTOMCOURSEBUILDER"
service = "customcoursebuilder"

[[d1_databases]]
binding = "DB"
database_name = "elle-corpus"
database_id = "4ed6773a-e5c5-4708-8738-73ae9f57fc9b"

# Native binding onto RAPID²AI's own database. Lets the router's rapid_*
# tools (src/rapid.ts) query directly instead of proxying HTTP calls through
# the RAPID_AI service binding below — no 1042 risk, no dead /tool 404s.
[[d1_databases]]
binding = "RAPID_DB"
database_name = "rapid2ai-db"
database_id = "3e31b005-eca1-4c62-bd7c-5f6527ef751e"

# Native binding onto the GrantIntelligence repo's grant-worker database.
# grant-intelligence.ts reads grant_opportunities/grant_funder_990_overview
# directly — that worker owns ingestion/verification/dedup/maintenance for
# them entirely (moved out of this repo; see
# docs/GRANT_INTELLIGENCE_SUITE_MAP.md). Same "no HTTP, no latency/failure
# coupling to another worker's uptime" rationale as RAPID_DB above.
[[d1_databases]]
binding = "GRANT_DB"
database_name = "grant-intelligence-db"
database_id = "5c9cbfec-ec99-4d88-a61b-7663801944d2"

[[kv_namespaces]]
binding = "SESSIONS"
id = "b659cdfdac084cbc9d502c4f26962047"

[[kv_namespaces]]
binding = "AUTH_TOKENS"
id = "eaef117dc6e74e17b8c4c4717ea3727b"

# Router scratchpad — short-TTL working memory (src/scratchpad.ts).
[[kv_namespaces]]
binding = "SCRATCHPAD"
id = "ce5b567ebc66438e8f54c3a63ad7cb18"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "elle-documents"

[[vectorize]]
binding = "VECTORIZE"
index_name = "elle-corpus-vectors"

# Real code execution — the CONNECT-BACK sandbox. The dead end here was the
# Cloudflare Sandbox SDK: it needs a Containers-enabled account and a Docker
# image build at deploy time, and its Dockerfile.sandbox template references a
# turbo/pnpm monorepo (@repo/sandbox-container) this repo is not — so `wrangler
# deploy` failed on the image build on EVERY push, blocking ALL deploys. We do
# not re-enter that trap. Execution happens on the operator's own laptop, but
# there is no Durable Object holding a socket anymore either: the laptop POLLS
# /api/sandbox-bus/poll for sealed jobs and SUBMITS sealed results back — a
# stateless event bus (session-bus.ts), COROS sealed under hyperbolic-sync's
# counter-free keystream. No container image, no Containers entitlement, no
# deploy-time build, no standing connection. See src/session-bus.ts +
# src/connect-sandbox.ts.

# Migration history. v1 registered the old (container) Sandbox class; v2
# removed it. v3 registered the connect-back SandboxAgent (a plain DO holding
# a WebSocket); v4 removes it now that the session bus (above) replaces the
# socket with stateless polling — no DO needed for the sandbox at all. The
# earlier tags stay listed as already-applied history and are never re-run.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v2"
deleted_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_classes = ["SandboxAgent"]

[[migrations]]
tag = "v4"
deleted_classes = ["SandboxAgent"]

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "elle-ingest-queue"

[[queues.consumers]]
queue = "elle-ingest-queue"
max_batch_size = 10
max_batch_timeout = 30

# A single */1 cron trigger drives all daemon loops via clock-dispatch in
# scheduled() (heartbeat every min; trading :*/15; research hourly; dream 03:00
# UTC; journal 20:00 UTC; grant_ingest 06:00 UTC). Uses 1 of the 5-per-account
# cron budget, not 5.
# IMPORTANT: keep this block — `wrangler deploy` reconciles triggers to this file,
# so removing it deletes the live cron and silently stops the daemon.
[triggers]
crons = ["*/1 * * * *"]

[vars]
ENVIRONMENT = "production"
# LEGACY/DEMO FALLBACK venue for anonymous /api/atlas callers. Signed-in
# Atlas clients get their venue PER REQUEST from atlas_clients (self-serve
# signup, src/atlas-clients.ts) — this var no longer gates the whole product.
# rapid2ai-db is multi-tenant by venue_id; without this set, anonymous
# rapid_* calls cleanly report "VENUE_ID not configured" rather than
# guessing. Find a value with:
#   wrangler d1 execute rapid2ai-db --remote --command "SELECT DISTINCT venue_id FROM vendor_document_payload LIMIT 5"
VENUE_ID = "ven_tin_mill"

# ── Atlas Google BUSINESS sign-in (src/atlas-business-auth.ts) ───────────
# These three are NOT secrets — the client ID is public, and the URLs are
# just addresses. They live here rather than as dashboard variables because
# `wrangler deploy` treats this file as authoritative for [vars]: a value set
# only in the dashboard is wiped by the next deploy, and the OAuth routes
# would start reporting "not configured" with nothing in the diff to explain
# it. The two real secrets — GOOGLE_CLIENT_SECRET and INGEST_API_TOKEN — are
# set with `wrangler secret put` and never appear in this file.
#
# GOOGLE_OAUTH_REDIRECT must match an Authorized redirect URI on the Google
# Cloud OAuth client EXACTLY, character for character, or Google refuses the
# exchange with redirect_uri_mismatch. Swap both URLs when the custom domain
# goes live (and add the new redirect URI in Google Cloud BEFORE deploying).
GOOGLE_OAUTH_REDIRECT = "https://elle-worker.sbarteau2022.workers.dev/api/atlas/oauth/callback"
ATLAS_APP_URL = "https://rapidai.pages.dev"
INGEST_URL = "https://rapid2ai-ingestion.sbarteau2022.workers.dev"

# OBSERVER AUTO-DRAIN (src/observer.ts + the observer_drain cron). Naming an
# owner user id here ARMS the history corpus to run itself: every 5 minutes the
# scheduled handler ensures the closed-case docket is staged for this user
# (idempotent — a drained docket never re-runs) and runs ONE queued case, then
# idles once the queue empties (an empty queue makes zero model calls). Each
# case spends ~5 model calls, so this is deliberate, visible, and bounded.
# Blank ⇒ the cron is a no-op. Owner set on request ("just let it self drain").
OBSERVER_AUTODRAIN_USER = "28430abe976eab8599b5103d58bf4192"

# CONVICTION TRIM EXECUTOR (src/trading.ts): the de-risk half of the
# validated recovery overlay. When a position's regulator κ strains below
# neutral, the cron trims it toward entryQty·min(1, κ/0.5). De-risk ONLY —
# this path never adds size and can never fully flatten a position (κ has an
# open floor). Armed 2026-07-30 on operator request: NVDA sat at ~198% of
# equity with κ≈0.28 and buying power exhausted, and the decision loop was
# not trimming on its own. Set to anything other than "on" to disarm.
ELLE_CONVICTION_ENFORCE = "on"

# LIVE TRADING is a TWO-KEY operation (src/live-guard.ts): a non-paper
# ALPACA_BASE_URL is refused everywhere unless the ELLE_LIVE_TRADING secret
# is exactly 'on'. Arm deliberately with:
#   wrangler secret put ELLE_LIVE_TRADING   (value: on)
# Never set it here in [vars] — a committed 'on' would defeat the second key.

# PAYROLL PROVIDER INTEGRATIONS (src/payroll/*.ts): QuickBooks/Gusto/ADP
# client id/secret + PAYROLL_TOKEN_ENC_KEY are Worker secrets (wrangler
# secret put X) — see .dev.vars.example for the full list. ADP additionally
# needs a Cloudflare mTLS certificate binding, which can't be pre-declared
# here without a real certificate:
#   wrangler mtls-certificate upload --cert adp-cert.pem --key adp-key.pem
#   [[mtls_certificates]]
#   binding = "ADP_MTLS_CERT"
#   certificate_id = "<id from the upload command>"
# Until that block is added (with a real certificate_id), ADP's connect/sync
# report "not configured" — the same fail-closed default as every other
# unset integration in this file.

# ── Settable config vars, with their in-code defaults ────────────────────────
# Per CLAUDE.md ("Configuration: where values actually go"): these are CONFIG
# VARS, not secrets. They belong here, in the committed file — a plain var set
# in the Cloudflare dashboard is WIPED by the next `wrangler deploy`, which
# treats this file as authoritative for [vars].
#
# Every one is read as `env.X || <default>`: unset degrades to the default
# shown, setting it turns that behavior on. Nothing below is dead code or
# "not in play" — they are live switches with no value assigned yet.
#
# Uncomment a line to override its default. Values shown ARE the current
# defaults, so uncommenting one as-written changes nothing; edit the value to
# make it take effect. Secrets (API keys, client secrets, JWT_SECRET, etc.)
# never go here — Cloudflare only. See docs/SERVICE_KEYS.md for the full split.

# Model selection (src/llm.ts). Overrides the per-lane default model id.
# LLM_MODEL_PRIMARY   = "meta-llama/llama-3.3-70b-instruct:free"
# LLM_MODEL_FAST      = "meta-llama/llama-3.3-70b-instruct:free"
# LLM_MODEL_CODE      = "qwen/qwen3-coder:free"
# LLM_MODEL_REASONING = "gemini-2.5-flash"
# LLM_MODEL_ADVISOR   = "claude-opus-5"
# LLM_MODEL_GROQ      = "llama-3.3-70b-versatile"
# LLM_MODEL_GITHUB    = "gpt-4o-mini"
# LLM_MODEL_OLLAMA    = "llama3.3:70b"

# Endpoint overrides. LLM_OLLAMA_URL has NO default — the Ollama lane stays
# off until it is set (its paired LLM_OLLAMA_KEY is a secret, set in Cloudflare).
# LLM_BASE_URL          = "https://openrouter.ai/api/v1"
# LLM_OLLAMA_URL        = "https://<your-ollama-host>"
# LLM_GITHUB_MODELS_URL = "https://models.inference.ai.azure.com/chat/completions"

# Trading position sizing (src/order-guards.ts) — fraction of equity.
# ELLE_MAX_ORDER_FRAC  = "0.10"
# ELLE_MAX_SYMBOL_FRAC = "0.15"

# Alpaca endpoint. Defaults to PAPER. Pointing this at the live endpoint is
# refused unless the ELLE_LIVE_TRADING secret is exactly 'on' (src/live-guard.ts).
# ALPACA_BASE_URL = "https://paper-api.alpaca.markets"

# Connect-back sandbox: per-call LLM timeout, ms. Clamped to 1_000–600_000.
# SANDBOX_LLM_TIMEOUT_MS = "180000"

# Lane protocol v2 live-routing cutover — opt-in; any other value keeps v1.
# ELLE_LANE_PROTOCOL = "v2"

# Optimus journal: also condition on the most recent entry's prose for voice
# continuity. Unset = true. Set "false" to condition on extracted threads alone.
# JOURNAL_INCLUDE_PRIOR_PROSE = "false"

# Flock media (src/flock.ts). Image generation runs on Workers AI (env.AI) with
# no config. Flip provider to 'sovereign' and set the URL to move to your own
# endpoint; the paired FLOCK_IMAGE_KEY / FLOCK_VIDEO_KEY are SECRETS.
# FLOCK_IMAGE_PROVIDER   = "workers-ai"   # 'workers-ai' | 'sovereign' | 'auto'
# FLOCK_IMAGE_URL        = "https://<your-image-endpoint>"
# FLOCK_IMAGE_MODEL      = "<txt2img model id on your endpoint>"
# FLOCK_IMAGE_MODEL_EDIT = "<img2img model id on your endpoint>"
# FLOCK_VIDEO_PROVIDER   = "sovereign"
# FLOCK_VIDEO_URL        = "https://<your-text-to-video-endpoint>"
# FLOCK_VIDEO_MODEL      = "<model id>"

# Payroll OAuth (src/payroll/*.ts). REQUIRED for QuickBooks/Gusto to complete a
# connection — the client id/secret pairs alone are not enough, the redirect URI
# must match what is registered with the provider. PAYROLL_TOKEN_ENC_KEY (a
# secret) gates all payroll regardless.
# QUICKBOOKS_REDIRECT_URI = "https://elle-worker.sbarteau2022.workers.dev/api/payroll/callback"
# QUICKBOOKS_ENVIRONMENT  = "sandbox"   # 'sandbox' (default) | 'production'
# GUSTO_REDIRECT_URI      = "https://elle-worker.sbarteau2022.workers.dev/api/payroll/callback"
# GUSTO_ENVIRONMENT       = "demo"      # 'demo' (default) | 'production'
